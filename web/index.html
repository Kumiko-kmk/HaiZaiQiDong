<!DOCTYPE html>
<html lang="zh-CN" data-theme="ironclad">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HaiZaiQiDong</title>
  <link rel="icon" type="image/png" href="assets/HaiZaiQiDong.png" />
  <script>
    (() => {
      let stored = null;
      try {
        stored = localStorage.getItem("mouse-sketch-drawer.theme");
      } catch (_error) {
        // Some embedded browser policies can disable local storage.
      }
      const valid = /^(ironclad|silent|regent|necrobinder|defect)$/.test(stored || "");
      document.documentElement.dataset.theme = valid ? stored : "ironclad";
    })();
  </script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="window-drag-region pywebview-drag-region" aria-hidden="true"></div>
  <button class="window-control window-close" id="btn-close" type="button" aria-label="关闭程序">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 6l12 12M18 6L6 18" />
    </svg>
  </button>

  <div class="app">
    <nav class="nav" id="nav" aria-label="主导航">
      <button class="nav-btn active" data-page="draw" type="button" aria-label="绘制">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14.5 5.5l4 4M4 20l1-4L15.5 5.5a2 2 0 0 1 3 3L8 19l-4 1Z" />
        </svg>
        <span class="nav-btn__label">绘制</span>
      </button>
      <button class="nav-btn" data-page="canvas" type="button" aria-label="画布">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="4" width="17" height="16" rx="2" />
          <path d="M7 15c2-5 4 3 6-2s3-2 4 1" />
        </svg>
        <span class="nav-btn__label">画布</span>
      </button>
      <button class="nav-btn" data-page="history" type="button" aria-label="绘制历史">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 12a8.5 8.5 0 1 1 2.6 6.1" />
          <path d="M3.5 19v-4h4" />
          <path d="M12 7.5V12l3 2" />
        </svg>
        <span class="nav-btn__label">历史</span>
      </button>
      <button class="nav-btn" data-page="settings" type="button" aria-label="设置">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h9M17 7h3" />
          <path d="M4 12h3M11 12h9" />
          <path d="M4 17h9M17 17h3" />
          <circle cx="15" cy="7" r="2" />
          <circle cx="9" cy="12" r="2" />
          <circle cx="15" cy="17" r="2" />
        </svg>
        <span class="nav-btn__label">设置</span>
      </button>
    </nav>

    <main class="content">
      <section class="page page--active" id="page-draw">
        <div class="draw-drag-zone draw-drag-zone--left pywebview-drag-region" aria-hidden="true"></div>
        <div class="draw-drag-zone draw-drag-zone--bottom pywebview-drag-region" aria-hidden="true"></div>
        <div id="wheel-root" class="wheel-root"></div>
        <p id="scale-hint" class="scale-hint" hidden></p>
      </section>

      <section class="page" id="page-canvas" aria-label="画布">
        <div class="canvas-toolbar">
          <div class="canvas-toolbar__drag pywebview-drag-region" aria-hidden="true"></div>
          <div class="canvas-toolbar__actions">
            <button class="btn btn--canvas" id="btn-canvas-upload-svg" type="button">上传SVG</button>
            <button class="btn btn--canvas" id="btn-canvas-clear" type="button">清空画布</button>
            <button class="btn btn--canvas" id="btn-canvas-save" type="button">保存预设</button>
            <button class="btn btn--canvas" id="btn-manage-presets" type="button" disabled>管理预设</button>
          </div>
        </div>
        <div class="sketch-canvas-wrap" id="sketch-canvas-wrap">
          <canvas id="sketch-canvas" width="720" height="360" aria-label="自定义预设绘图画布"></canvas>
        </div>
      </section>

      <section class="page" id="page-history" aria-label="历史">
        <div class="history-drag-rail pywebview-drag-region" aria-hidden="true"></div>
        <button class="window-control history-refresh" id="btn-history-refresh" type="button" aria-label="刷新历史">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 8v-4l-2 2a8 8 0 1 0 2.2 8" />
            <path d="M19 4h-4" />
          </svg>
        </button>
        <ul class="history-list" id="history-list"></ul>
      </section>

      <section class="page" id="page-settings" aria-label="设置">
        <div class="setting-row">
          <div class="setting-row__drag pywebview-drag-region" aria-hidden="true"></div>
          <span class="setting-label">窗口置顶</span>
          <label class="switch">
            <input type="checkbox" id="topmost-switch" checked />
            <span class="switch-track" aria-hidden="true"></span>
          </label>
        </div>

        <div class="setting-row">
          <div class="setting-row__drag pywebview-drag-region" aria-hidden="true"></div>
          <span class="setting-label">绘制方式</span>
          <div class="draw-button-picker" id="draw-button-picker" role="radiogroup" aria-label="绘制方式">
            <label class="draw-button-option">
              <input type="radio" name="draw-button" value="left" />
              <span>左键</span>
            </label>
            <label class="draw-button-option">
              <input type="radio" name="draw-button" value="right" checked />
              <span>右键</span>
            </label>
          </div>
        </div>

        <div class="setting-row setting-row--theme">
          <div class="setting-row__drag pywebview-drag-region" aria-hidden="true"></div>
          <span class="setting-label">界面配色</span>
          <div class="theme-picker" id="theme-picker" role="group" aria-label="界面配色">
            <button class="theme-dot" type="button" data-theme-value="ironclad" aria-label="战士红"></button>
            <button class="theme-dot" type="button" data-theme-value="silent" aria-label="静默猎手绿"></button>
            <button class="theme-dot" type="button" data-theme-value="regent" aria-label="储君黄"></button>
            <button class="theme-dot" type="button" data-theme-value="necrobinder" aria-label="灵魂契约师紫"></button>
            <button class="theme-dot" type="button" data-theme-value="defect" aria-label="故障机器人蓝"></button>
          </div>
        </div>

        <div class="settings-actions">
          <div class="settings-actions__drag pywebview-drag-region" aria-hidden="true"></div>
          <button class="btn btn--outline" id="btn-about" type="button">关于</button>
        </div>
        <div class="settings-drag-fill pywebview-drag-region" aria-hidden="true"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>

  <dialog class="dialog" id="about-dialog">
    <span class="dialog-accent" aria-hidden="true"></span>
    <h2>关于</h2>
    <p>HaiZaiQiDong · 还在启动<br />滚轮切换预设；进入预览后用 W/S 缩放、A/D 旋转，左键落点，右键取消。</p>
    <button class="btn btn--primary" id="btn-about-close" type="button">确定</button>
  </dialog>

  <dialog class="dialog save-preset-dialog" id="save-preset-dialog">
    <form id="save-preset-form">
      <span class="dialog-accent" aria-hidden="true"></span>
      <h2>保存自定义预设</h2>
      <label class="dialog-label" for="preset-name-input">预设名称</label>
      <input
        class="dialog-input"
        id="preset-name-input"
        name="preset-name"
        type="text"
        maxlength="40"
        autocomplete="off"
        placeholder="请输入预设名称"
      />
      <p class="dialog-error" id="preset-name-error" hidden></p>
      <div class="dialog-actions">
        <button class="btn btn--muted" id="btn-save-cancel" type="button">取消</button>
        <button class="btn btn--primary" id="btn-save-confirm" type="submit">确认</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog manage-presets-dialog" id="manage-presets-dialog">
    <span class="dialog-accent" aria-hidden="true"></span>
    <h2>管理自定义预设</h2>
    <div class="manage-preset-list" id="manage-preset-list" aria-live="polite"></div>
    <div class="dialog-actions">
      <button class="btn btn--muted" id="btn-manage-close" type="button">关闭</button>
    </div>
  </dialog>

  <script src="js/curve.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/wheel-cards.js"></script>
  <script src="js/canvas-editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
